name: Desktop build and tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore "Feldbuch Desktop.slnx"
      - run: dotnet build "Feldbuch Desktop.slnx" --no-restore --configuration Release
      - run: dotnet test Feldbuch.Tests/Feldbuch.Tests.csproj --no-build --no-restore --configuration Release --blame-hang-timeout 45s --blame-hang-dump-type none --logger trx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: Feldbuch.Tests/TestResults/
